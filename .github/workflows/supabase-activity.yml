name: Supabase activity check

# Objectif : envoyer une requête RPC légère au projet pour réduire le risque de pause pour inactivité.
# Fréquence : deux exécutions par jour, à 09:17 et 16:17 UTC. GitHub peut décaler une exécution planifiée.
# Limite : Supabase ne garantit pas qu'un nombre précis de requêtes empêchera la mise en pause.
# Données : la fonction ne lit ni ne modifie les données familiales ; la clé publishable est conçue pour être publique.
on:
  schedule:
    - cron: '17 9,16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send a minimal database request
        env:
          SUPABASE_URL: https://kbwenuerbzahbjxqbarq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_gegMBE-98ZZz7mldq2GMjQ_6ogNmvWk
        run: >-
          curl --fail --silent --show-error --max-time 20 --output /dev/null
          --request POST
          --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}"
          --header 'Content-Type: application/json'
          --data '{}'
          "${SUPABASE_URL}/rest/v1/rpc/activity_check"
